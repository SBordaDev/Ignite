version: '3.8'

services:
  # 1. Tu aplicación Spring Boot
  ignite-app:
    build: . # Busca el Dockerfile en la misma carpeta
    container_name: ignite-backend
    ports:
      - "8080:8080"
    networks:
      - ignite-network

  # 2. Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: ignite-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - ignite-app # Espera a que la app inicie
    networks:
      - ignite-network

  # 3. Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: ignite-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - ignite-network

  # 4. Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: ignite-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # Apagamos la seguridad para agilizar el entorno local
      - ES_JAVA_OPTS=-Xms2g -Xmx2g # Le asignamos 2GB de RAM
    ports:
      - "9200:9200"
    networks:
      - ignite-network

  # 5. Logstash
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: ignite-logstash
    volumes:
      # Conectamos el archivo que acabas de crear
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "50000:50000"
    depends_on:
      - elasticsearch
    networks:
      - ignite-network

  # 6. Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: ignite-kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - ignite-network

  # 7. SonarQube (Calidad de Código)
  sonarqube:
    image: sonarqube:lts-community
    container_name: ignite-sonarqube
    ports:
      - "9000:9000"
    networks:
      - ignite-network

# Creamos una red privada para que los 3 contenedores se vean entre sí
networks:
  ignite-network:
    driver: bridge

