version: '3.8'

services:
  # 1. Tu aplicación Spring Boot
  ignite-app:
    build: . # Busca el Dockerfile en la misma carpeta
    container_name: ignite-backend
    ports:
      - "8080:8080"
    networks:
      - ignite-network

  # 2. Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: ignite-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - ignite-app # Espera a que la app inicie
    networks:
      - ignite-network

  # 3. Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: ignite-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - ignite-network

# Creamos una red privada para que los 3 contenedores se vean entre sí
networks:
  ignite-network:
    driver: bridge