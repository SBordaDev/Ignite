name: Ignite DevSecOps CI/CD Pipeline

# ¿Cuándo se ejecuta? Cada vez que subas código a la rama main
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-analyze:
    name: DevSecOps Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para que SonarQube lea el historial completo

      - name: 1.5. Escaneo de Secretos (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

      - name: 2. Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven # Acelera las descargas de dependencias

      - name: 3. Compilar y Ejecutar Pruebas Unitarias (JaCoCo & Allure)
        run: mvn clean test

      - name: 4. Análisis de Vulnerabilidades (OWASP Dependency-Check)
        # Aquí inyectamos tu llave de la NVD de forma segura
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn dependency-check:check -Dnvd.key=$NVD_API_KEY

      - name: 5. Empaquetar la Aplicación (.jar)
        run: mvn package -DskipTests

      - name: 6. Guardar Artefactos (El reporte HTML de seguridad y el JAR)
        uses: actions/upload-artifact@v4
        with:
          name: ignite-artefactos
          path: |
            target/*.jar
            target/dependency-check-report.html
      - name: 7. Login en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 8. Construir y Subir la Imagen Docker
        run: |
          REPO_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/$REPO_LOWER/ignite-backend:latest"
          
          echo "Construyendo imagen: $IMAGE_NAME"
          docker build -t $IMAGE_NAME .
          
          echo "Subiendo imagen al casillero de GitHub..."
          docker push $IMAGE_NAME